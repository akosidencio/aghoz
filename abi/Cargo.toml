[package]
name = "aghoz-abi"
description = "Stable C ABI over aghoz-core. The single surface every language binding targets."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../README.md"

[lints]
workspace = true
[lib]
name = "aghoz"
# cdylib for dynamic FFI (Python ctypes, Ruby FFI, Node); staticlib for cgo and for
# anyone who would rather link it in.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# The version is not decoration: a path-only dependency cannot be published, and it is
# what makes `cargo deny`'s wildcard rule pass. `scripts/set-version.mjs` bumps it.
aghoz-core = { path = "../core", version = "0.4.3" }
