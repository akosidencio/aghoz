# What CI, a contributor's machine and a release build all use, so a new stable cannot
# turn the gate red on a commit that changed nothing. An unpinned `stable` also left the
# floor unrecorded: nothing said which versions this actually builds on.
#
# The floor itself is `rust-version` in Cargo.toml. It is 1.88 because `napi-build` says
# so; the core alone needs 1.82, for `Option::is_none_or`.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
