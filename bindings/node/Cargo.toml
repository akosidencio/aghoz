[package]
name = "aghoz-node"
description = "Node.js binding for aghoz-core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# The version is not decoration: a path-only dependency cannot be published, and it is
# what makes `cargo deny`'s wildcard rule pass. `scripts/set-version.mjs` bumps it.
aghoz-core = { path = "../../core", version = "0.5.0" }
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
