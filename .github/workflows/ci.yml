name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs; a stale result on an old commit is noise.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Active LTS and current. Node 20 reached end of life on 2026-04-30, and
        # testing it would be claiming support we do not intend to maintain.
        node: [22, 24]
    # Redis is optional for users, so the backplane tests skip themselves without it.
    # CI runs them, because "optional" must not mean "untested".
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
        env:
          REDIS_PORT: 6379

  # The corpus is the contract between implementations (PROTOCOL.md §12). It runs as
  # its own job so a failure names itself in the checks list rather than hiding inside
  # a package's suite.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: conformance corpus (javascript)
        run: pnpm conformance
      # The subscriber half — §9, which no server-side suite can check. Its own step so a
      # client regression names itself rather than arriving as "conformance failed".
      - name: client conformance corpus
        run: pnpm conformance:client
      # The same corpus, through the Rust core's Node binding. This is what proves the
      # two implementations agree — and it is the gate every future language binding
      # will pass through before it ships.
      - uses: dtolnay/rust-toolchain@stable
      - name: build the node binding
        run: |
          cargo build --release -p aghoz-node
          mkdir -p bindings/node/dist
          cp target/release/libaghoz_node.so bindings/node/dist/aghoz.node
      - name: conformance corpus (rust core, via node)
        run: node conformance/runner.mjs ./bindings/node/conformance-adapter.mjs
      - name: the node suite against the rust core
        working-directory: packages/server
        run: node --test "test/native-parity.test.mjs"
      - name: corpus is regenerable and committed in sync
        run: |
          node conformance/build-vectors.mjs
          git diff --exit-code conformance/vectors.json \
            || (echo "::error::vectors.json is out of sync with build-vectors.mjs" && exit 1)
          node conformance/client/build-vectors.mjs
          git diff --exit-code conformance/client/vectors.json \
            || (echo "::error::client vectors.json is out of sync with its builder" && exit 1)
          node conformance/http/build-scenarios.mjs
          git diff --exit-code conformance/http/scenarios.json \
            || (echo "::error::scenarios.json is out of sync with build-scenarios.mjs" && exit 1)

  # The other half of the corpus: the HTTP layer, driven over a real socket.
  #
  # vectors.json pins the protocol core, which every implementation gets by linking the
  # same Rust. This pins the ~950 lines each language rewrites in full — statuses,
  # headers, write order, teardown — and it is where every production bug in this project
  # has come from. Its own job so a failure names itself in the checks list.
  conformance-http:
    name: http conformance (node adapter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm conformance:http

  # Reko's API runs NestJS on Bun. Node remains the supported server runtime, while this
  # production-shaped lane makes Bun 1.3.14 compatibility explicit and regression-tested:
  # the entire HTTP corpus plus the Nest Express and Redis Streams paths used by Reko.
  bun-runtime:
    name: bun 1.3.14 compatibility (Nest + Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: HTTP conformance corpus on Bun
        run: pnpm conformance:http:bun
      - name: NestJS Express stream on Bun
        run: pnpm smoke:bun:nest
      - name: Redis Streams fan-out and replay on Bun
        run: pnpm smoke:bun:redis
        env:
          REDIS_PORT: 6379

  # `core/` reads the same vectors.json the JavaScript runner does. Once the bindings
  # land (DECISIONS.md D3) this job is what proves every language agrees.
  #
  # The toolchain comes from rust-toolchain.toml rather than `@stable`, so this and a
  # contributor's machine see the same lints.
  conformance-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - name: conformance corpus (rust)
        run: cargo test --release

      # Clippy was absent here for the whole life of the crate, and `not_unsafe_ptr_arg_deref`
      # — deny-by-default, and the reason every ABI entry point is now `unsafe fn` — had
      # been failing silently that entire time. `--all-targets` matters: the tests are
      # where the ABI's contract is actually exercised.
      - name: clippy (warnings are failures)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: formatting
        run: cargo fmt --all -- --check
      - name: docs build, and intra-doc links resolve
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Advisories, licences and duplicate versions. Three dependencies today, all first
  # party or napi — which is exactly when this is cheap to add and easy to keep green.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # The C ABI is the only place in the project with unsafe code, and a C ABI cannot be
  # written without it. Miri executes those paths looking for undefined behaviour —
  # out-of-bounds reads, use-after-free, invalid aliasing — rather than trusting review.
  miri:
    name: verify the unsafe (miri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # `rust-toolchain.toml` pins stable, which would override the nightly this job
      # installs — and miri only exists on nightly.
      - run: cargo +nightly miri test -p aghoz-abi
        env:
          RUSTUP_TOOLCHAIN: nightly

  # core/ must never acquire unsafe. If this fails, protocol logic has moved into the
  # ABI layer or the forbid attribute has been removed.
  core-is-safe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # forbid(unsafe_code) is compiler-enforced: unsafe in core/ simply will not
      # build. So the only thing that can go wrong is the attribute being deleted, and
      # that is what this guards.
      - name: core keeps forbid(unsafe_code)
        run: |
          grep -q '#!\[forbid(unsafe_code)\]' core/src/lib.rs \
            || (echo "::error::core/src/lib.rs must keep #![forbid(unsafe_code)]" && exit 1)
      - name: and it still compiles under it
        run: cargo build -p aghoz-core

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-invariants.mjs

  example:
    name: the quickstart actually runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # The definition of done is a developer getting push working in ten minutes. If
      # the example stops booting, that claim is already false.
      - run: node scripts/smoke-example.mjs
